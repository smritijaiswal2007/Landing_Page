<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Navbar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body{
    background:#f2f2f2;

}

/* NAVBAR */
.navbar{
  background:#2b2b2b;           /* dark neutral gray */
    padding:16px 90px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 8px 22px rgba(0,0,0,0.35);
}

/* LOGO */
.logo{
    font-size:22px;
    font-weight:600;
    color:#f59e0b;                /* warm orange */
    letter-spacing:0.5px;
}

/* LINKS */
.nav-links{
    list-style:none;
    display:flex;
    gap:34px;
}

.nav-links a{
    text-decoration:none;
    color:#e5e5e5;
    font-size:15px;
    font-weight:500;
    position:relative;
    padding-bottom:6px;
}

.nav-links a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:0;
    height:2px;
    background:#f59e0b;
    transition:width 0.25s ease;
}

.nav-links a:hover{
    color:#ffffff;
}

.nav-links a:hover::after{
    width:100%;
}

/* BUTTON */
.btn{
    background:#f59e0b;
    color:#2b2b2b;
    border:none;
    padding:9px 22px;
    border-radius:6px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:all 0.25s ease;
}

.btn:hover{
    background:#d97706;
    transform:translateY(-1px);
}

/* RESPONSIVE */
@media(max-width:900px){
    .nav-links{
    display:none;
    }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">PROFIRMA</div>

    <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Clients</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <button class="btn">Get Started</button>
</nav>

</body>
</html>
